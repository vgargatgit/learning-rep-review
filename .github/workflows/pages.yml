name: Deploy learning site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/content
          cp -R site/. _site/
          touch _site/.nojekyll

          for item in README.md PROJECT_STATUS.md CONTRIBUTING.md references.bib papers experiments docs; do
            if [[ -e "$item" ]]; then
              cp -R "$item" _site/content/
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
